# Departments the router can forward messages to.
# Edit this file to match your company -- no code changes needed,
# just restart the container:  docker compose restart api
#
# Each department has:
#   email        - address the message is forwarded to
#   name         - short name (shown in the API and logs)
#   description  - guidance for the AI model: WHAT belongs here and what does NOT.
#                  This is the most important field -- routing quality depends on it.
#
# fallback: department that receives anything the model cannot assign
#           (or when the model fails). Must be one of the addresses below.
#
# A Polish example lives in examples/departments.pl.yaml.

fallback: other@example.com

departments:
  - email: it@example.com
    name: IT
    description: >
      Technical problems: computers, hardware, software, network, printers,
      accounts and passwords, plus security incidents (e.g. a suspicious email / phishing).

  - email: help-desk@example.com
    name: Help Desk
    description: >
      Concrete support requests that are not an IT failure: equipment orders
      (mouse, headset, laptop), access to internal systems, "how do I use tool X"
      questions. This is NOT a catch-all.

  - email: human-resources@example.com
    name: HR
    description: >
      General HR matters: contracts, onboarding, workplace conduct and conflicts,
      benefits (e.g. gym cards), insurance, training, recruitment, performance
      reviews. Benefits and training ALWAYS go here.

  - email: payroll@example.com
    name: Payroll & Leave
    description: >
      Payroll and absence administration: vacation / time off, sick leave,
      salary, payslips. Does NOT include travel expense reimbursement.

  - email: other@example.com
    name: Other
    description: >
      Everything else: topics unrelated to the company, small talk, thank-yous
      with no request, unintelligible text, or anything that fits no department.
